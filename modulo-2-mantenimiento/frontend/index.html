<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mantenimiento TUPA - UNSAAC</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

    <header class="encabezado">

        <div>
            <h1>Plataforma TUPA - UNSAAC</h1>
            <p>Módulo de Mantenimiento</p>
        </div>

    </header>


    <main class="contenedor">

        <section class="bienvenida">

            <h2>Mantenimiento del TUPA</h2>

            <p>
                Administre los procedimientos, categorías, oficinas
                y requisitos del TUPA.
            </p>

        </section>


        <section class="menu">

            <button onclick="mostrarModulo('procedimientos')">
                Procedimientos
            </button>

            <button onclick="mostrarModulo('categorias')">
                Categorías
            </button>

            <button onclick="mostrarModulo('oficinas')">
                Oficinas
            </button>

            <button onclick="mostrarModulo('requisitos')">
                Requisitos
            </button>

        </section>


        <section id="contenido">

            <div class="mensaje">

                <h3>Seleccione un módulo</h3>

                <p>
                    Utilice los botones superiores para administrar
                    la información del TUPA.
                </p>

            </div>

        </section>

    </main>


    <footer>

        <p>
            UNSAAC - Plataforma Web para la Gestión del TUPA
        </p>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
